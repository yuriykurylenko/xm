apply:
  title: "Apply"
  form:
    submittingText: "Submitting..."
    inputs:
      - name: "full_name"
        type: "text"
        placeholder: "Full Name"
        required: true

      - name: "email"
        type: "email"
        placeholder: "Email"
        required: true

      - name: "coach_id"
        type: "hidden"

  routing:
    successPath: "/{coachSlug}/success"

createAccount:
  title: "Create account"
  form:
    hoc: withAuthFunctions
    submittingText: "Creating account..."
    inputs:
      - name: "email"
        type: "email"
        placeholder: "Email"
        disabled: true

      - name: "password"
        type: "password"
        placeholder: "Password"
        required: true

archive:
  title: "Archive"
  icon: faTrash
  useApi: true
  dialog:
    title: "Archive {{full_name}}"
    titleBulk: "Archive {{n}} clients"
    text: "Are you sure you would like to archive {{full_name}}?"
    textBulk: "Are you sure you would like to archive {{n}} clients?"
