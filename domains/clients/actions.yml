apply:
  title: "Apply"
  submittingText: "Submitting..."
  form:
    inputs:
      - name: "full_name"
        type: "text"
        placeholder: "Full Name"
        required: true

      - name: "email"
        type: "email"
        placeholder: "Email"
        required: true

      - name: "coach_id"
        type: "hidden"

  routing:
    successPath: "/{coachSlug}/success"

createAccount:
  title: "Create account"
  submittingText: "Creating account..."
  form:
    hoc: withAuthFunctions
    inputs:
      - name: "email"
        type: "email"
        placeholder: "Email"
        disabled: true

      - name: "password"
        type: "password"
        placeholder: "Password"
        required: true

      - name: "clientId"
        type: "hidden"
